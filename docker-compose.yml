# 로컬/온프레미스 전체 스택 실행
#   docker compose up --build
#
# 두 앱 모두 **리포지토리 루트를 빌드 컨텍스트**로 쓴다. npm workspaces 구조라
# 각 앱 디렉터리만으로는 `@skbs/shared` 의존성을 해석할 수 없기 때문이다.

services:
  db:
    image: mariadb:11.4
    container_name: skbs-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE:      ${DB_NAME:-skbs_it_report}
      MARIADB_USER:          ${DB_USER:-skbs}
      MARIADB_PASSWORD:      ${DB_PASSWORD:-skbs}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    # 시각은 전부 UTC 로 저장한다 (애플리케이션이 KST 로 변환) — config/db.ts 주석 참고
    command: ["--default-time-zone=+00:00",
              "--character-set-server=utf8mb4",
              "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # 최초 기동 시 스키마 자동 적용
      - ./apps/backend/src/config/schema.mariadb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:     ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout:  3s
      retries:  10

  backend:
    build:
      context:    .
      dockerfile: Dockerfile.railway
    container_name: skbs-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # 마이그레이션이 DB 기동보다 먼저 돌지 않도록
    env_file:
      - .env
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      # 수집한 엑셀·캡처가 재시작 후에도 남아야 한다. 대시보드는 이 파일들을
      # 다시 읽어 스냅샷을 만들므로, 유실되면 다음 수집 전까지 값이 빈다.
      - ./apps/backend/uploads:/app/uploads
      - ./apps/backend/outputs:/app/outputs

  frontend:
    build:
      context:    .
      dockerfile: Dockerfile.frontend
    container_name: skbs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  dbdata:
