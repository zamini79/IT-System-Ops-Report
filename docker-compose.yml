# 로컬/온프레미스 전체 스택 실행
#   docker compose up --build
#
# 두 앱 모두 **리포지토리 루트를 빌드 컨텍스트**로 쓴다. npm workspaces 구조라
# 각 앱 디렉터리만으로는 `@skbs/shared` 의존성을 해석할 수 없기 때문이다.

services:
  db:
    image: mariadb:11.4
    container_name: skbs-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE:      ${DB_NAME:-skbs_it_report}
      MARIADB_USER:          ${DB_USER:-skbs}
      MARIADB_PASSWORD:      ${DB_PASSWORD:-skbs}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    # 시각은 전부 UTC 로 저장한다 (애플리케이션이 KST 로 변환) — config/db.ts 주석 참고
    command: ["--default-time-zone=+00:00",
              "--character-set-server=utf8mb4",
              "--collation-server=utf8mb4_unicode_ci"]
    ports:
      # 호스트 3306 은 로컬 MariaDB/MySQL 이 이미 점유하는 경우가 많다.
      # 점유되어 있으면 이 매핑이 조용히 가려져 엉뚱한 DB 에 붙게 되므로
      # 기본을 3307 로 둔다. (컨테이너 사이 통신은 db:3306 이라 영향 없음)
      - "${DB_PORT:-3307}:3306"
    volumes:
      - dbdata:/var/lib/mysql
      # 최초 기동 시 스키마 자동 적용
      - ./apps/backend/src/config/schema.mariadb.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:     ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout:  3s
      retries:  10

  backend:
    build:
      context:    .
      dockerfile: Dockerfile.railway
    container_name: skbs-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy   # 마이그레이션이 DB 기동보다 먼저 돌지 않도록
    env_file:
      - .env
    # ⚠️ env_file 은 이미지의 ENV 를 덮어쓴다. 아래 environment 가 최우선이므로
    #    컨테이너에서만 달라야 하는 값은 반드시 여기에 둔다.
    environment:
      # .env 의 NODE_ENV=development 가 이미지의 ENV NODE_ENV=production 을 덮어써
      # 프로덕션 이미지가 development 로 도는 문제가 있었다. 여기서 되돌린다.
      #   (평문 http 로 로컬 테스트할 때는 리프레시 쿠키의 Secure 플래그 때문에
      #    세션 갱신이 안 될 수 있다. 그때만 이 줄을 잠시 주석 처리한다)
      NODE_ENV: production
      # 컨테이너에서는 호스트의 유닉스 소켓에 닿을 수 없으므로 TCP 로 db 에 붙는다.
      # (config/db.ts 는 DATABASE_URL 이 있으면 그것을 우선한다)
      DATABASE_URL: mysql://${DB_USER:-skbs}:${DB_PASSWORD:-skbs}@db:3306/${DB_NAME:-skbs_it_report}
      UPLOAD_DIR: /app/uploads
      # nginx 가 서비스하는 출처. 같은 출처 프록시라 대부분의 요청에는 Origin 이
      # 붙지 않지만, 붙는 요청(POST 등)도 통과해야 한다.
      #   `${VAR:-기본값}` 는 .env 값으로 보간되므로(compose 가 .env 를 먼저 읽는다)
      #   .env 의 개발용 5173 이 그대로 들어온다. 컨테이너가 실제로 서비스하는
      #   출처를 **항상 덧붙여** 두어야 한다. 운영 도메인은 PUBLIC_ORIGIN 으로 추가.
      CORS_ORIGIN: http://localhost:3000,http://127.0.0.1:3000${PUBLIC_ORIGIN:+,${PUBLIC_ORIGIN}}
      # ⚠️ 리프레시 쿠키 플래그 — 평문 http 기준 기본값이다.
      #    HTTPS(ALB·리버스프록시 TLS)로 서비스하면 반드시 COOKIE_SECURE=true 로 올린다.
      #    Secure 쿠키를 평문 http 로 내려보내면 브라우저가 조용히 버려서
      #    로그인은 된 것처럼 보이다가 세션 갱신이 401 로 실패한다.
      #    프론트와 API 가 다른 사이트인 배포에서만 COOKIE_SAMESITE=none.
      COOKIE_SECURE:   ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      # 수집한 엑셀·캡처가 재시작 후에도 남아야 한다. 대시보드는 이 파일들을
      # 다시 읽어 스냅샷을 만들므로, 유실되면 다음 수집 전까지 값이 빈다.
      #   리포지토리 루트의 uploads/ 가 실제 수집 산출물 위치다
      #   (UPLOAD_DIR 이 상대경로여서 루트에서 실행할 때 여기에 쌓였다)
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs

  frontend:
    build:
      context:    .
      dockerfile: Dockerfile.frontend
    container_name: skbs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  dbdata:
